name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload shop screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gzn-shop-preview
          path: test-results/**/gzn-*.png
          if-no-files-found: error
